<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Nueva consulta — BeWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; supported-color-schemes: dark; }
  body, table, td, p, a, h1, h2 { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse; }
  a { color: #9CC2E0; }
  /* iOS detecta teléfonos y direcciones y los pinta de azul: que hereden el color del texto */
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; }

  /* FormPost inyecta los <li> acá dentro, así que sólo se pueden estilar desde esta hoja */
  .bw-fields { list-style: none; margin: 0; padding: 0; }
  .bw-fields li {
    margin: 0;
    padding: 14px 0;
    border-bottom: 1px solid #2E3C4D;
    font-family: 'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: #EDE6D8;
  }
  .bw-fields li:first-child { padding-top: 0; }
  .bw-fields li:last-child { padding-bottom: 0; border-bottom: 0; }
  .bw-fields strong {
    display: block;
    margin-bottom: 5px;
    font-family: 'Space Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9CC2E0;
  }

  @media only screen and (max-width: 620px) {
    .bw-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .bw-box { padding: 20px !important; }
    .bw-title { font-size: 30px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#141B27;">

<!-- Texto de vista previa en la bandeja de entrada -->
<div style="display:none; max-height:0; max-width:0; opacity:0; overflow:hidden; font-size:1px; line-height:1px; color:#141B27;">
  Entró una consulta nueva por el formulario de {{website_id}}.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#141B27;">
<tr>
<td align="center" style="padding:36px 12px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

    <!-- Logotipo -->
    <tr>
      <td class="bw-pad" style="padding:0 4px 22px; font-family:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:27px; font-weight:500; letter-spacing:-0.04em; line-height:1;">
        <span style="color:#B5473A;">be</span><span style="color:#9CC2E0;">Web</span>
      </td>
    </tr>

    <!-- Tarjeta principal -->
    <tr>
      <td style="background-color:#1B2433; border:1px solid #2E3C4D;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

          <!-- Filete ladrillo -->
          <tr>
            <td height="3" style="height:3px; line-height:3px; font-size:0; mso-line-height-rule:exactly; background-color:#B5473A;">&nbsp;</td>
          </tr>

          <tr>
            <td class="bw-pad" style="padding:40px;">

              <h1 class="bw-title" style="margin:0; font-family:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:36px; font-weight:500; letter-spacing:-0.045em; line-height:1.05; color:#EDE6D8;">
                Nueva consulta.
              </h1>

              <!-- Origen del envío -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0 0;">
                <tr>
                  <td style="border:1px solid #2E3C4D; padding:7px 12px; font-family:'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; line-height:1; color:#9CC2E0;">
                    Sitio: {{website_id}}
                  </td>
                </tr>
              </table>

              <!-- Datos del formulario -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:30px 0 0; background-color:#1F2F45; border:1px solid #2E3C4D;">
                <tr>
                  <td class="bw-box" style="padding:26px;">
                    <h2 style="margin:0 0 6px; font-family:'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size:11px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase; color:#9CC2E0;">
                      Datos del formulario
                    </h2>
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td height="1" style="height:1px; line-height:1px; font-size:0; mso-line-height-rule:exactly; background-color:#2E3C4D;">&nbsp;</td>
                      </tr>
                      <tr>
                        <td style="padding-top:18px;">
                          <ul class="bw-fields" style="list-style:none; margin:0; padding:0; font-family:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.55; color:#EDE6D8;">
                            {{fields}}
                          </ul>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <p style="margin:26px 0 0; font-family:'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; line-height:1.6; color:#AEACA7;">
                Ya le llegó el mail de confirmación. Quedamos en responderle dentro de las 24 horas hábiles.
              </p>

            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Pie -->
    <tr>
      <td class="bw-pad" style="padding:22px 4px 0;">
        <p style="margin:0; font-family:'Space Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; line-height:1.6; color:#6B6F73;">
          Enviado automáticamente por FormPost
        </p>
      </td>
    </tr>

  </table>

</td>
</tr>
</table>

</body>
</html>
